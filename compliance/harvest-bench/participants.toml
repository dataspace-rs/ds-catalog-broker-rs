# crates/crawler config for the harvesting benchmark
# (compliance/harvest-benchmark-2026-08-27.md). Points at the same two
# new real Eclipse EDC 0.18.0 participant instances EDC's own
# federated-catalog crawler is benchmarked against
# (compliance/harvest-bench/edc-fedcat-runtime/), started via the
# existing, unmodified ../crawler-edc-fixture/run-instance.sh +
# spike.CatalogFixtureExtension mechanism - see
# ../crawler-edc-integration-test.md for that mechanism's own proof.
#
# `credential_protocol` omitted (defaults to "none") for both, matching
# every prior benchmark's own documented scope decision (real EDC-side
# DCP/OID4VP is out of scope - see ../benchmark-dcp-2026-08-27.md).
#
# `interval_secs = 5` - short and observable, matching the period this
# benchmark also configures for EDC's own crawler
# (edc.catalog.cache.execution.period.seconds, see
# edc-fedcat-runtime/run-fedcat-crawler.sh) so both systems' background
# harvesting loops re-crawl at comparable frequency during the load-test
# window.
#
# Matches the schema in crates/crawler/src/config.rs
# (ParticipantsConfig/ParticipantEntry).

interval_secs = 5

[[participants]]
id = "harvest-d"
name = "Harvest participant D (3 datasets)"
catalog_request_url = "http://127.0.0.1:19221/api/dsp/2025-1/catalog/request"

[[participants]]
id = "harvest-e"
name = "Harvest participant E (7 datasets)"
catalog_request_url = "http://127.0.0.1:19321/api/dsp/2025-1/catalog/request"
