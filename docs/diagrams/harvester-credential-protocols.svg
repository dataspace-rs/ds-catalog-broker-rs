<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img"
     aria-label="Outbound credential presentation when crawling a gated participant, per docs/oid4vp-holder-2026-08-28.md. crawl_one reads each participant's configured credential_protocol. None sends a fixed placeholder Authorization header, real DSP servers require some header even when they enforce no real authentication. Dcp mints a self-issued token bound to the target participant's own DID and attaches it directly as a bearer token on the catalog request - no round trip before the request. Oid4Vp builds a JWT verifiable presentation wrapping the holder's credential plus a presentation submission, POSTs both to the participant's own oid4vp response URI, and receives a short-lived access token in return, which is then attached as the bearer token on the same catalog request - one extra round trip before the request. Both protocols reuse the same holder identity and the same underlying JWS and did:web primitives from dcp-core; only the wire message shape differs. Either way the same GET catalog request URL is called with the resulting bearer token.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #64748b; stroke-width: 1; }
    .crawler { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
    .dcp { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.25; }
    .oid4vp { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 1.25; }
    .remote { fill: #fef9f5; stroke: #c2410c; stroke-width: 1.25; }
    .label { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 12.5px; }
    .sublabel { fill: #1e293b; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; }
    .caption { fill: #475569; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 10.5px; }
    .title { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .dcptext { fill: #1e40af; }
    .oid4vptext { fill: #5b21b6; }
    .flow-dcp { stroke: #1d4ed8; stroke-width: 1.5; fill: none; }
    .flow-oid4vp { stroke: #6d28d9; stroke-width: 1.5; fill: none; }
    .flow-both { stroke: #334155; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0b1220; stroke: #94a3b8; }
      .crawler { fill: #111827; stroke: #94a3b8; }
      .dcp { fill: #0d1a33; stroke: #60a5fa; }
      .oid4vp { fill: #1e1b3a; stroke: #a78bfa; }
      .remote { fill: #2a1608; stroke: #fb923c; }
      .label { fill: #e2e8f0; }
      .sublabel { fill: #e2e8f0; }
      .caption { fill: #94a3b8; }
      .title { fill: #f1f5f9; }
      .dcptext { fill: #93c5fd; }
      .oid4vptext { fill: #c4b5fd; }
      .flow-dcp { stroke: #60a5fa; }
      .flow-oid4vp { stroke: #a78bfa; }
      .flow-both { stroke: #cbd5e1; }
    }
  </style>
  <defs>
    <marker id="arrow-dcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrow-oid4vp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9" />
    </marker>
    <marker id="arrow-both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="560" />

  <text class="title" x="500" y="26" text-anchor="middle">Outbound credential presentation: one choice per configured participant</text>
  <text class="caption" x="500" y="44" text-anchor="middle">crawl_one() reads each participant's credential_protocol - same holder identity, same dcp-core JWS/did:web primitives, different wire shape</text>

  <!-- crawler / decision -->
  <rect class="crawler" x="40" y="76" width="260" height="76" rx="8" />
  <text class="label" x="170" y="100" text-anchor="middle">crates/crawler::crawl_one</text>
  <text class="sublabel" x="170" y="118" text-anchor="middle">match participant.credential_protocol</text>
  <text class="caption" x="170" y="136" text-anchor="middle">{ None | Dcp | Oid4Vp }</text>

  <!-- None branch -->
  <rect class="box" x="40" y="196" width="260" height="60" rx="6" />
  <text class="label" x="170" y="220" text-anchor="middle">None</text>
  <text class="caption" x="170" y="238" text-anchor="middle">fixed placeholder Authorization header</text>
  <path class="flow-both" marker-end="url(#arrow-both)" d="M 170,152 L 170,196" />

  <!-- Dcp branch -->
  <rect class="dcp" x="40" y="284" width="260" height="106" rx="8" />
  <text class="dcptext title" x="170" y="306" text-anchor="middle" font-size="13">Dcp</text>
  <text class="dcptext sublabel" x="170" y="326" text-anchor="middle">mint_self_issued_token(target_did)</text>
  <text class="dcptext caption" x="170" y="344" text-anchor="middle">a self-issued JWS, aud = target participant's DID</text>
  <text class="dcptext caption" x="170" y="360" text-anchor="middle">attached directly - no round trip first</text>
  <path class="flow-dcp" marker-end="url(#arrow-dcp)" d="M 170,152 C 90,180 90,260 90,284" />

  <!-- Oid4Vp branch -->
  <rect class="oid4vp" x="40" y="418" width="260" height="126" rx="8" />
  <text class="oid4vptext title" x="170" y="440" text-anchor="middle" font-size="13">Oid4Vp</text>
  <text class="oid4vptext sublabel" x="170" y="460" text-anchor="middle">oid4vp::present(...)</text>
  <text class="oid4vptext caption" x="170" y="476" text-anchor="middle">build vp_token + presentation_submission,</text>
  <text class="oid4vptext caption" x="170" y="492" text-anchor="middle">POST to oid4vp_response_uri,</text>
  <text class="oid4vptext caption" x="170" y="508" text-anchor="middle">receive a short-lived access_token back</text>
  <path class="flow-oid4vp" marker-end="url(#arrow-oid4vp)" d="M 170,152 C 260,190 260,380 260,418" />

  <!-- Oid4Vp's own round trip to the participant's response endpoint -->
  <rect class="remote" x="380" y="418" width="260" height="70" rx="6" />
  <text class="label" x="510" y="444" text-anchor="middle">Participant's oid4vp_response_uri</text>
  <text class="caption" x="510" y="462" text-anchor="middle">verifies the presentation, issues access_token</text>
  <path class="flow-oid4vp" marker-end="url(#arrow-oid4vp)" d="M 300,462 L 380,462" />
  <path class="flow-oid4vp" marker-end="url(#arrow-oid4vp)" stroke-dasharray="4 3" d="M 380,478 C 340,500 300,500 300,480" />
  <text class="caption" x="510" y="484" text-anchor="middle">(the one extra round trip Dcp's direct-attach path skips)</text>

  <!-- Convergence: attach bearer token -->
  <rect class="crawler" x="700" y="240" width="260" height="70" rx="8" />
  <text class="label" x="830" y="264" text-anchor="middle">Authorization: Bearer &lt;token&gt;</text>
  <text class="caption" x="830" y="282" text-anchor="middle">self-issued JWS (Dcp) or access_token (Oid4Vp)</text>
  <text class="caption" x="830" y="298" text-anchor="middle">attached on the same catalog_request_url call</text>

  <path class="flow-dcp" marker-end="url(#arrow-both)" d="M 300,320 C 500,290 600,280 700,270" />
  <path class="flow-oid4vp" marker-end="url(#arrow-both)" d="M 300,470 C 500,400 600,320 700,290" />
  <path class="flow-both" marker-end="url(#arrow-both)" d="M 300,226 C 500,240 600,255 700,262" />

  <!-- Gated participant -->
  <rect class="remote" x="700" y="356" width="260" height="70" rx="6" />
  <text class="label" x="830" y="382" text-anchor="middle">Gated participant's catalog endpoint</text>
  <text class="caption" x="830" y="400" text-anchor="middle">POST .../catalog/request, same request either way</text>
  <path class="flow-both" marker-end="url(#arrow-both)" d="M 830,310 L 830,356" />
</svg>
