<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" role="img"
     aria-label="Internal architecture of the semantic cache. crates/crawler parses a crawled DSP response into a catalog_core::Catalog domain value, including a generic properties map, and upserts it through the CatalogCache trait. The Oxigraph-backed implementation stores each origin node as its own named graph, decomposed into real DCAT triples (dcat:Catalog, dcat:Dataset, dcat:Distribution, dcat:DataService) plus one triple per generic property, using fcns:property/&lt;key&gt; as the predicate. crawler::collect_datasets_and_services populates title, description, version, creatorName, thumbnail, and keywords this way when the source catalog provides them; any other property key round-trips the same way. Three HTTP surfaces read from the store: a per-participant dataset list, a real SPARQL 1.1 query endpoint, and the management API's catalog request endpoint, which decodes properties back into the federated-catalog-client wire format. No automated test yet proves the properties round-trip through a real Oxigraph store end to end; only the live demo stack was checked manually. None of these surfaces answer the Dataspace Protocol's own CatalogRequestMessage.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
    .trait { fill: #fffbeb; stroke: #b45309; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .cache { fill: #ecfdf5; stroke: #047857; stroke-width: 1.5; }
    .graph { fill: #ffffff; stroke: #047857; stroke-width: 1; }
    .mech { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .label { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; }
    .sublabel { fill: #1e293b; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11.5px; }
    .mono { fill: #1e293b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
    .caption { fill: #475569; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11px; }
    .title { fill: #0f172a; font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .traittext { fill: #92400e; }
    .cachetext { fill: #065f46; }
    .mechtext { fill: #3730a3; }
    .flow { stroke: #334155; stroke-width: 1.5; fill: none; }
    .read { stroke: #6d28d9; stroke-width: 1.5; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #111827; stroke: #94a3b8; }
      .trait { fill: #2a1e05; stroke: #fbbf24; }
      .cache { fill: #052e21; stroke: #34d399; }
      .graph { fill: #0b1220; stroke: #34d399; }
      .mech { fill: #1e1b4b; stroke: #818cf8; }
      .label { fill: #e2e8f0; }
      .sublabel { fill: #e2e8f0; }
      .mono { fill: #cbd5e1; }
      .caption { fill: #94a3b8; }
      .title { fill: #f1f5f9; }
      .traittext { fill: #fde68a; }
      .cachetext { fill: #6ee7b7; }
      .mechtext { fill: #c7d2fe; }
      .flow { stroke: #94a3b8; }
      .read { stroke: #a78bfa; }
    }
  </style>
  <defs>
    <marker id="arrow-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155" />
    </marker>
    <marker id="arrow-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="660" />

  <text class="title" x="490" y="26" text-anchor="middle">Internal architecture: the semantic cache</text>
  <text class="caption" x="490" y="44" text-anchor="middle">crates/crawler → catalog_core::Catalog → CatalogCache trait → OxigraphCatalogCache</text>

  <!-- crawler -->
  <rect class="box" x="40" y="64" width="230" height="72" rx="6" />
  <text class="label" x="155" y="88" text-anchor="middle">crawler::crawl_once</text>
  <text class="sublabel" x="155" y="108" text-anchor="middle">collect_datasets_and_services()</text>
  <text class="caption" x="155" y="124" text-anchor="middle">title, description, thumbnail, ...</text>

  <!-- domain type -->
  <rect class="box" x="310" y="64" width="230" height="72" rx="6" />
  <text class="label" x="425" y="88" text-anchor="middle">catalog_core::Catalog</text>
  <text class="sublabel" x="425" y="108" text-anchor="middle">domain value</text>
  <text class="caption" x="425" y="124" text-anchor="middle">Dataset { properties: BTreeMap, .. }</text>

  <!-- trait -->
  <rect class="trait" x="580" y="64" width="230" height="72" rx="6" />
  <text class="traittext title" x="695" y="88" text-anchor="middle">CatalogCache (trait)</text>
  <text class="traittext sublabel" x="695" y="108" text-anchor="middle">upsert() / query() / delete()</text>
  <text class="traittext caption" x="695" y="124" text-anchor="middle">backend-agnostic on purpose</text>

  <path class="flow" marker-end="url(#arrow-flow)" d="M 270,100 L 310,100" />
  <path class="flow" marker-end="url(#arrow-flow)" d="M 540,100 L 580,100" />

  <!-- OxigraphCatalogCache -->
  <rect class="cache" x="140" y="164" width="700" height="210" rx="8" />
  <text class="cachetext title" x="490" y="190" text-anchor="middle">OxigraphCatalogCache</text>
  <text class="cachetext caption" x="490" y="208" text-anchor="middle">rdf_store::oxigraph_backend — built on contreforts_kg::GraphStore (Oxigraph)</text>

  <!-- named graphs -->
  <rect class="graph" x="170" y="226" width="200" height="122" rx="6" />
  <text class="label" x="270" y="248" text-anchor="middle">Named graph: node A</text>
  <text class="mono" x="270" y="268" text-anchor="middle">&lt;ds-1&gt; a dcat:Dataset ;</text>
  <text class="mono" x="270" y="283" text-anchor="middle">  dct:format "..." ;</text>
  <text class="mono" x="270" y="298" text-anchor="middle">  fcns:property/title</text>
  <text class="mono" x="270" y="313" text-anchor="middle">  "Air Quality Sensors" .</text>
  <text class="caption" x="270" y="336" text-anchor="middle">real DCAT triples + property triples</text>

  <rect class="graph" x="390" y="226" width="200" height="122" rx="6" />
  <text class="label" x="490" y="248" text-anchor="middle">Named graph: node B</text>
  <text class="mono" x="490" y="268" text-anchor="middle">&lt;ds-7&gt; a dcat:Dataset ;</text>
  <text class="mono" x="490" y="283" text-anchor="middle">  dcat:accessService &lt;svc&gt; ;</text>
  <text class="mono" x="490" y="298" text-anchor="middle">  fcns:property/version</text>
  <text class="mono" x="490" y="313" text-anchor="middle">  "2.3.0" .</text>
  <text class="caption" x="490" y="336" text-anchor="middle">same shape, different graph</text>

  <rect class="graph" x="610" y="226" width="200" height="122" rx="6" stroke-dasharray="4 3" />
  <text class="label" x="710" y="248" text-anchor="middle">Named graph: node N</text>
  <text class="caption" x="710" y="270" text-anchor="middle">…one graph per</text>
  <text class="caption" x="710" y="286" text-anchor="middle">crawled origin node,</text>
  <text class="caption" x="710" y="302" text-anchor="middle">re-crawled = replaced</text>
  <text class="caption" x="710" y="318" text-anchor="middle">wholesale on upsert()</text>

  <!-- the generic-properties mechanism, promoted, not a footnote -->
  <rect class="mech" x="170" y="396" width="640" height="92" rx="6" />
  <text class="mechtext title" x="490" y="420" text-anchor="middle">Generic properties → triples</text>
  <text class="mechtext sublabel" x="490" y="440" text-anchor="middle">Each Dataset.properties entry becomes one triple: &lt;dataset-iri&gt; fcns:property/&lt;key&gt; "&lt;value&gt;" .</text>
  <text class="mechtext sublabel" x="490" y="456" text-anchor="middle">crawler populates title/description/version/creatorName/thumbnail/keywords this way when present;</text>
  <text class="mechtext sublabel" x="490" y="472" text-anchor="middle">any other key round-trips the same way — see rdf_store::oxigraph_backend's module doc for the mapping</text>

  <!-- http-api reads, this product's three serving surfaces -->
  <rect class="box" x="170" y="520" width="200" height="64" rx="6" />
  <text class="label" x="270" y="544" text-anchor="middle">http-api: GET /catalog</text>
  <text class="caption" x="270" y="564" text-anchor="middle">non-DSP, per participant</text>

  <rect class="box" x="390" y="520" width="200" height="64" rx="6" />
  <text class="label" x="490" y="544" text-anchor="middle">http-api: /sparql</text>
  <text class="caption" x="490" y="564" text-anchor="middle">SPARQL 1.1, GET/POST</text>

  <rect class="box" x="610" y="520" width="200" height="64" rx="6" />
  <text class="label" x="710" y="538" text-anchor="middle">http-api: mgmt API</text>
  <text class="sublabel" x="710" y="554" text-anchor="middle">POST .../catalogs/request</text>
  <text class="caption" x="710" y="570" text-anchor="middle">decodes properties back</text>

  <path class="read" marker-end="url(#arrow-read)" d="M 270,520 L 270,488" />
  <path class="read" marker-end="url(#arrow-read)" d="M 490,520 L 490,488" />
  <path class="read" marker-end="url(#arrow-read)" d="M 710,520 L 710,488" />
  <text class="caption" x="490" y="504" text-anchor="middle">query() / SPARQL evaluation / properties decode</text>

  <text class="caption" x="490" y="610" text-anchor="middle">None of these surfaces answer the DSP CatalogRequestMessage — that's the connector's other components' job.</text>
  <text class="caption" x="490" y="626" text-anchor="middle">The full crawl → Oxigraph → mgmt-API round trip for properties is checked manually, not yet by an automated test (see README).</text>
</svg>
