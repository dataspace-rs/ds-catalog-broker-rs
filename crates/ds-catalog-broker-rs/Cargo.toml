[package]
name = "ds-catalog-broker-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum HTTP server for the DSP Catalog Broker: harvests 1..N upstream DSP Catalog Services into a unified semantic (RDF) cache and serves it locally as a dataset-list-per-participant view and a SPARQL endpoint - it does not itself answer incoming DSP CatalogRequestMessages."

[[bin]]
name = "ds-catalog-broker-rs"
path = "src/main.rs"

[dependencies]
catalog-core = { path = "../catalog-core" }
rdf-store = { path = "../rdf-store" }
dcp-core = { path = "../dcp-core" }
crawler = { path = "../crawler" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
p256 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
