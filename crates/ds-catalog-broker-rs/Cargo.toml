[package]
name = "ds-catalog-broker-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Axum HTTP server for the DSP Catalog Broker: harvests 1..N upstream DSP Catalog Services into a unified semantic (RDF) cache and serves it locally as a dataset-list-per-participant view and a SPARQL endpoint - it does not itself answer incoming DSP CatalogRequestMessages."

[[bin]]
name = "ds-catalog-broker-rs"
path = "src/main.rs"

[dependencies]
catalog-core = { path = "../catalog-core" }
rdf-store = { path = "../rdf-store" }
dcp-core = { path = "../dcp-core" }
crawler = { path = "../crawler" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
# JWT verification for the OAuth2 Bearer gate - see src/oauth2.rs's module
# doc and docs/oauth2-bearer-gating-2026-08-28.md.
jsonwebtoken = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
urlencoding = { workspace = true }
# Mint EC keypairs and hand-sign compact JWS test tokens for a mock JWKS
# endpoint in oauth2.rs's and lib.rs's own tests - independent of both
# jsonwebtoken's own EncodingKey and of dcp-core's sign_jws, so the
# production verifier this exercises is proven against a signer with no
# shared code path. See oauth2.rs's `test_support` module.
p256 = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
