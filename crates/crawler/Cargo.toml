[package]
name = "crawler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Federated Catalog Semantic Harvester's crawl engine: polls a local-config participant registry's DSP catalog endpoints (with optional DCP holder support), playing the DSP Consumer role, and upserts results into rdf-store's semantic (Oxigraph-backed) CatalogCache."

[dependencies]
catalog-core = { path = "../catalog-core" }
rdf-store = { path = "../rdf-store" }
dcp-core = { path = "../dcp-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Only for crates/crawler/tests/multi_participant_crawl.rs - a hermetic
# multi-instance integration test that runs real ds-catalog-broker-rs server
# instances in-process. Not needed by any library code in this crate.
ds-catalog-broker-rs = { path = "../ds-catalog-broker-rs" }
axum = { workspace = true }
tracing-subscriber = { workspace = true }
